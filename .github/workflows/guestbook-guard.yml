
name: Guestbook Guard

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: guestbook-guard
    runs-on: ubuntu-latest

    steps:
      - name: Skip non-guestbook PRs
        if: ${{ !startsWith(github.head_ref, 'guestbook/') }}
        run: echo "Regular portfolio PR; guestbook restrictions do not apply."

      - name: Checkout guestbook PR
        if: ${{ startsWith(github.head_ref, 'guestbook/') }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify changed files
        if: ${{ startsWith(github.head_ref, 'guestbook/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          files="$(gh api \
            "repos/$REPO/pulls/$PR_NUMBER/files" \
            --paginate \
            --jq '.[].filename')"

          if [ "$files" != "data/guestbook.json" ]; then
            echo "Rejected: guestbook PRs may change only data/guestbook.json."
            printf 'Changed files:\n%s\n' "$files"
            exit 1
          fi

      - name: Validate guestbook JSON
        if: ${{ startsWith(github.head_ref, 'guestbook/') }}
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime
          from pathlib import Path

          path = Path("data/guestbook.json")

          if not path.is_file():
              raise SystemExit("Guestbook file is missing.")

          try:
              entries = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"Invalid JSON: {exc}")

          if not isinstance(entries, list):
              raise SystemExit("Guestbook must be a JSON array.")

          if len(entries) > 10000:
              raise SystemExit("Too many entries.")

          allowed_keys = {
              "id", "name", "message", "createdAt",
              "theme", "color", "sticker", "layout"
          }

          themes = {"aero", "pastel", "dark", "classic"}
          stickers = {"none", "flower", "star", "heart", "cat", "cloud"}
          layouts = {"cards", "sticky-notes", "guestbook"}
          seen_ids = set()

          for i, entry in enumerate(entries):
              if not isinstance(entry, dict):
                  raise SystemExit(f"Entry {i} must be an object.")

              if set(entry) != allowed_keys:
                  raise SystemExit(f"Entry {i} has missing or extra fields.")

              entry_id = entry["id"]
              if not isinstance(entry_id, str) or not re.fullmatch(
                  r"[a-f0-9-]{16,64}", entry_id
              ):
                  raise SystemExit(f"Entry {i} has an invalid ID.")

              if entry_id in seen_ids:
                  raise SystemExit(f"Duplicate ID in entry {i}.")
              seen_ids.add(entry_id)

              for field, limit in (("name", 32), ("message", 500)):
                  value = entry[field]
                  if (
                      not isinstance(value, str)
                      or not 1 <= len(value.strip()) <= limit
                  ):
                      raise SystemExit(f"Entry {i} has an invalid {field}.")

              timestamp = entry["createdAt"]
              if not isinstance(timestamp, str) or len(timestamp) > 40:
                  raise SystemExit(f"Entry {i} has an invalid timestamp.")

              try:
                  parsed = datetime.fromisoformat(
                      timestamp.replace("Z", "+00:00")
                  )
                  if parsed.tzinfo is None:
                      raise ValueError("Timezone is missing")
              except ValueError:
                  raise SystemExit(
                      f"Entry {i} must have an ISO timestamp with a timezone."
                  )

              if not isinstance(entry["theme"], str) or entry["theme"] not in themes:
                  raise SystemExit(f"Entry {i} has an invalid theme.")

              if not isinstance(entry["color"], str) or not re.fullmatch(
                  r"#[0-9a-fA-F]{6}", entry["color"]
              ):
                  raise SystemExit(f"Entry {i} has an invalid colour.")

              if not isinstance(entry["sticker"], str) or entry["sticker"] not in stickers:
                  raise SystemExit(f"Entry {i} has an invalid sticker.")

              if not isinstance(entry["layout"], str) or entry["layout"] not in layouts:
                  raise SystemExit(f"Entry {i} has an invalid layout.")

          print(f"Validated {len(entries)} guestbook entries.")
          PY
