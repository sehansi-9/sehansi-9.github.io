
name: Guestbook Guard

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: guestbook-guard
    runs-on: ubuntu-latest

    steps:
      - name: Skip non-guestbook PRs
        if: ${{ !startsWith(github.head_ref, 'guestbook/') }}
        run: echo "Regular portfolio PR; guestbook restrictions do not apply."

      - name: Checkout guestbook PR
        if: ${{ startsWith(github.head_ref, 'guestbook/') }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify changed files
        if: ${{ startsWith(github.head_ref, 'guestbook/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          files="$(gh api \
            "repos/$REPO/pulls/$PR_NUMBER/files" \
            --paginate \
            --jq '.[].filename')"

          if [ "$files" != "data/guestbook.json" ]; then
            echo "Rejected: guestbook PRs may change only data/guestbook.json."
            printf 'Changed files:\n%s\n' "$files"
            exit 1
          fi


      - name: Validate guestbook JSON
        if: ${{ startsWith(github.head_ref, 'guestbook/') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from datetime import datetime
          from pathlib import Path

          path = Path("data/guestbook.json")

          def load_json(text, label):
              try:
                  return json.loads(text)
              except Exception as exc:
                  raise SystemExit(f"{label} is invalid JSON: {exc}")

          if not path.is_file():
              raise SystemExit("Guestbook file is missing.")

          base_text = subprocess.run(
              ["git", "show", f"{__import__('os').environ['BASE_SHA']}:data/guestbook.json"],
              check=True, capture_output=True, text=True
          ).stdout

          before = load_json(base_text, "Base guestbook")
          after = load_json(path.read_text(encoding="utf-8"), "PR guestbook")

          if not isinstance(before, list) or not isinstance(after, list):
              raise SystemExit("Guestbook must be a JSON array.")

          if len(before) >= 10000 or len(after) > 10000:
              raise SystemExit("Guestbook entry limit exceeded.")

          if len(after) != len(before) + 1 or after[:-1] != before:
              raise SystemExit(
                  "Rejected: PR must preserve all existing entries and append exactly one."
              )

          entry = after[-1]
          allowed_keys = {
              "id", "name", "message", "createdAt",
              "theme", "color", "sticker", "layout"
          }

          if not isinstance(entry, dict) or set(entry) != allowed_keys:
              raise SystemExit("New entry has missing or extra fields.")

          if not isinstance(entry["id"], str) or not re.fullmatch(
              r"[a-f0-9-]{36}", entry["id"]
          ):
              raise SystemExit("Invalid entry ID.")

          if any(item.get("id") == entry["id"] for item in before):
              raise SystemExit("Duplicate entry ID.")

          for field, limit in (("name", 32), ("message", 500)):
              value = entry[field]
              if (
                  not isinstance(value, str)
                  or not 1 <= len(value.strip()) <= limit
              ):
                  raise SystemExit(f"Invalid {field}.")

          timestamp = entry["createdAt"]
          if not isinstance(timestamp, str) or len(timestamp) > 40:
              raise SystemExit("Invalid timestamp.")

          try:
              parsed = datetime.fromisoformat(timestamp.replace("Z", "+00:00"))
              if parsed.tzinfo is None:
                  raise ValueError("Timezone missing")
          except ValueError:
              raise SystemExit("Timestamp must be ISO format with a timezone.")

          if entry["theme"] not in {"aero", "pastel", "dark", "classic"}:
              raise SystemExit("Invalid theme.")

          if not isinstance(entry["color"], str) or not re.fullmatch(
              r"#[0-9a-fA-F]{6}", entry["color"]
          ):
              raise SystemExit("Invalid colour.")

          if entry["sticker"] not in {
              "none", "flower", "star", "heart", "cat", "cloud"
          }:
              raise SystemExit("Invalid sticker.")

          if entry["layout"] not in {
              "cards", "sticky-notes", "guestbook"
          }:
              raise SystemExit("Invalid layout.")

          print("Guestbook PR validated: exactly one new entry appended.")
          PY
